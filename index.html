<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a12">
    <title>UNO - Multiplayer Card Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="screen active">
        <div class="loading-content">
            <h1 class="loading-title">UNO</h1>
            <div class="loading-cards">
                <div class="loading-card red"></div>
                <div class="loading-card blue"></div>
                <div class="loading-card green"></div>
                <div class="loading-card yellow"></div>
            </div>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
            <p class="loading-text" id="loading-text">Loading...</p>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="menu-screen" class="screen">
        <div class="menu-bg"></div>
        <div class="particles" id="particles"></div>

        <div class="menu-content">
            <header class="menu-header">
                <h1 class="game-title">UNO</h1>
                <p class="game-subtitle">MULTIPLAYER CARD GAME</p>
            </header>

            <div class="player-profile">
                <div class="avatar">👤</div>
                <div class="profile-info">
                    <span class="player-name" id="menu-player-name">Player</span>
                    <span class="player-level">Level <span id="player-level">1</span></span>
                </div>
                <div class="xp-bar">
                    <div class="xp-fill" id="xp-fill" style="width: 0%"></div>
                </div>
            </div>

            <div class="mode-selection">
                <p class="section-label">SELECT MODE</p>
                <div class="mode-cards">
                    <button class="mode-card active" data-mode="classic" onclick="selectMode('classic')">
                        <span class="mode-icon">🎮</span>
                        <span class="mode-name">Classic</span>
                        <span class="mode-desc">1v1v1v1</span>
                    </button>
                    <button class="mode-card" data-mode="team" onclick="selectMode('team')">
                        <span class="mode-icon">👥</span>
                        <span class="mode-name">Team</span>
                        <span class="mode-desc">2v2</span>
                    </button>
                    <button class="mode-card" data-mode="wild" onclick="selectMode('wild')">
                        <span class="mode-icon">🌟</span>
                        <span class="mode-name">Wild</span>
                        <span class="mode-desc">Extra Wilds</span>
                    </button>
                </div>
            </div>

            <div class="menu-actions">
                <button class="btn btn-primary" onclick="startQuickMatch()">
                    <span>⚡</span> Quick Match
                </button>
                <button class="btn btn-secondary" onclick="showCreateLobby()">
                    <span>🏠</span> Create Room
                </button>
                <button class="btn btn-secondary" onclick="showJoinLobby()">
                    <span>🔑</span> Join Room
                </button>
            </div>

            <div class="menu-footer">
                <button class="btn btn-ghost" onclick="showSettings()">⚙️ Settings</button>
                <button class="btn btn-ghost" onclick="showLeaderboard()">🏆 Leaderboard</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-table">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="game-info">
                    <span class="room-code" id="game-room-code"></span>
                    <span class="turn-timer" id="turn-timer">⏱️ 10s</span>
                </div>
                <button class="btn-leave" onclick="leaveGame()">✕</button>
            </div>

            <!-- Opponents -->
            <div class="opponents-area">
                <div class="opponent" id="opponent-top">
                    <div class="opponent-avatar">🤖</div>
                    <div class="opponent-info">
                        <span class="opponent-name">Bot 1</span>
                        <span class="card-count">7 cards</span>
                    </div>
                </div>
                <div class="opponent" id="opponent-left">
                    <div class="opponent-avatar">🤖</div>
                    <div class="opponent-info">
                        <span class="opponent-name">Bot 2</span>
                        <span class="card-count">7 cards</span>
                    </div>
                </div>
                <div class="opponent" id="opponent-right">
                    <div class="opponent-avatar">🤖</div>
                    <div class="opponent-info">
                        <span class="opponent-name">Bot 3</span>
                        <span class="card-count">7 cards</span>
                    </div>
                </div>
            </div>

            <!-- Center Area -->
            <div class="center-area">
                <div class="direction-indicator" id="direction-indicator">↻</div>

                <div class="discard-pile" id="discard-pile">
                    <div class="card-slot" id="top-card"></div>
                </div>

                <div class="color-indicator" id="color-indicator"></div>

                <div class="draw-pile" id="draw-pile" onclick="drawCard()">
                    <div class="card card-back"></div>
                    <span class="deck-count" id="deck-count">80</span>
                </div>
            </div>

            <!-- Player Hand -->
            <div class="player-area">
                <div class="hand-controls">
                    <button class="sort-btn" onclick="sortHand('color')">Sort Color</button>
                    <button class="sort-btn" onclick="sortHand('value')">Sort Value</button>
                </div>
                <div class="hand" id="player-hand"></div>
            </div>

            <!-- UNO Button -->
            <button class="uno-button" id="uno-btn" onclick="callUno()">UNO!</button>
        </div>

        <!-- Color Picker -->
        <div class="color-picker" id="color-picker">
            <div class="picker-title">Choose Color</div>
            <div class="color-options">
                <button class="color-btn red" onclick="chooseColor('red')">🔴</button>
                <button class="color-btn blue" onclick="chooseColor('blue')">🔵</button>
                <button class="color-btn green" onclick="chooseColor('green')">🟢</button>
                <button class="color-btn yellow" onclick="chooseColor('yellow')">🟡</button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div class="modal" id="game-over-modal">
            <div class="modal-content">
                <h2 id="game-result-title">Game Over</h2>
                <div class="results" id="game-results"></div>
                <div class="modal-actions">
                    <button class="btn btn-primary" onclick="playAgain()">Play Again</button>
                    <button class="btn btn-secondary" onclick="backToMenu()">Menu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal" id="create-modal">
        <div class="modal-content">
            <h2>Create Room</h2>
            <input type="text" id="create-name" placeholder="Your name" maxlength="15">
            <div class="player-count">
                <button class="count-btn active" onclick="setPlayerCount(2)">2</button>
                <button class="count-btn" onclick="setPlayerCount(3)">3</button>
                <button class="count-btn" onclick="setPlayerCount(4)">4</button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="createRoom()">Create</button>
                <button class="btn btn-secondary" onclick="closeModal('create-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Join Room Modal -->
    <div class="modal" id="join-modal">
        <div class="modal-content">
            <h2>Join Room</h2>
            <input type="text" id="join-code" placeholder="Room code (e.g., UNO-ABC12)" maxlength="9">
            <input type="text" id="join-name" placeholder="Your name" maxlength="15">
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="joinRoom()">Join</button>
                <button class="btn btn-secondary" onclick="closeModal('join-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="setting-row">
                <span>Sound Effects</span>
                <button class="toggle active" id="sound-toggle" onclick="toggleSetting('sound')">ON</button>
            </div>
            <div class="setting-row">
                <span>Turn Timer</span>
                <button class="toggle active" id="timer-toggle" onclick="toggleSetting('timer')">ON</button>
            </div>
            <div class="setting-row">
                <span>Card Stacking</span>
                <button class="toggle active" id="stack-toggle" onclick="toggleSetting('stack')">ON</button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('settings-modal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div class="modal" id="leaderboard-modal">
        <div class="modal-content">
            <h2>🏆 Leaderboard</h2>
            <div class="leaderboard-list" id="leaderboard-list"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('leaderboard-modal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
